name: draft
on:
  schedule:
    - cron: "30 0 * * *"      # 6:00 AM IST
    - cron: "0,30 1-17 * * *" # 6:30 AM se 11:00 PM IST
  workflow_dispatch:
concurrency:
  group: bot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-core libraqm0
      - run: pip install -r requirements.txt
      - run: mkdir -p data && python bot.py draft
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase && git push)
